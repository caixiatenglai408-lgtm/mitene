[mypy]
python_version = 3.11
packages = src
explicit_package_bases = True
mypy_path = src
namespace_packages = True
ignore_missing_imports = True
warn_unused_ignores = True
show_error_codes = True

# Mixin 分割構成のため、単体ファイルチェックでは attr-defined が大量に出る。
# CI では MiteneSender 経由の結合チェックを推奨。
disable_error_code = attr-defined

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
