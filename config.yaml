# 姫デコ ミテネ！自動送信

flow: standard

mitene:
  find_members_button: "ミテネできる会員を探す"
  remaining_label: "ミテネ残り回数"
  mitene_history_label: "ミテネ履歴"
  max_send_per_run: 0
  must_use_full_budget: false  # 送れる分だけ送る（サイト拒否時に0件で止めない）
  max_scroll_rounds: 30
  member_cooldown_days: 0  # 0=制限なし（同一会員への再送間隔）
  max_no_history_sends_per_day: 0  # 0=制限なし（履歴なし会員への1日上限）
  # 送信順（gid=女の子ID。新規=kitene_question「ミテネ履歴」に「送信済」なし）
  # ※ 実際の巡回順は src/mitene_sender.py の _execute_phased_send_pipeline が
  #   ハードコードする。下記の内容は「非空か＝フェーズ制を有効化するか」の判定
  #   （_send_mitene_standard の `if steps:`）にのみ使われる。順序整合のため記載。
  #   ①〜⑤の後、残り回数があれば安全候補からランダム追加消化する。
  priority_steps:
    # ① マイガール（新規）
    - tab: マイガール
      member_filter: new_only
      list_path: /J10ComeonMyGirlList.php
    # ② みたよ（新規）※ 旧「マッチ率新規0件のときのみ」条件は廃止・常時実行
    - tab: みたよ
      member_filter: new_only
      list_path: /J10ComeonVisitorList.php
    # ③ キープ（新規）
    - tab: キープ
      member_filter: new_only
      list_path: /J10ComeonKeepList.php
    # ④ マッチ率（新規・残りミテネ回数ぶん）
    - tab: マッチ率
      member_filter: new_only
      list_path: /J10ComeonAiMatchingList.php
    # ⑤ マッチ率（ミテネ履歴あり・送信日が古い順・同日はランダム）
    - tab: マッチ率
      member_filter: sent_oldest_first
      list_path: /J10ComeonAiMatchingList.php
  confirm_buttons:
    - "ミテネを送る"
    - "送る"
    - "OK"
  skip_special_banners: true
  # 会員抽出デバッグ（各タブの漏斗ログ・除外理由・送信対象一覧）
  member_extraction_debug: false
  # （非推奨・未使用）旧調査用フラグ。一覧取得は常にスクロール走査マージを使用
  member_scroll_merge_parse: false

# 待機時間（ミテネを押す間隔だけ手動風・それ以外は短めでOK）
human:
  enabled: true
  fast_send: true   # クリック処理のみ短縮（会員間の待ちは between_members_ms）
  typing_delay_ms: [40, 120]
  action_delay_ms: [80, 150]
  between_members_ms: [300, 500]   # ミテネを送る間隔（0.3〜0.5秒）
  between_accounts_ms: [3000, 5000]  # 次の女の子まで（3〜5秒）
  tab_switch_delay_ms: [400, 800]
  after_login_delay_ms: [0, 0]
  after_send_delay_ms: [40, 80]
  scroll_probability: 0
  idle_pause_probability: 0
  idle_pause_ms: [300, 600]
  shuffle_member_order: false
  shuffle_account_order: true

mitene_gift:
  menu_button_text: "ミテネギフトを送る"
  image_index: 0
  image_alt: ""
  user_selection: unsent_only
  message: "お待ちしてます！"

login:
  id_placeholder: "女の子ID or メールアドレス"
  password_placeholder: "半角英数字4〜12文字"
  submit_text: "ログイン"

browser:
  headless: true
  slow_mo_ms: 0
  timeout_ms: 45000
  viewport:
    width: 390
    height: 844
    is_mobile: true

logging:
  dir: logs
  screenshot_on_error: true
